# Release workflow for a team plugin: it packs only data (arvel.json, roles/ and
# checksums.txt) and creates a draft GitHub release. Copy it to
# .github/workflows/release.yml in the plugin repository.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' arvel.json > arvel.json.new
          mv arvel.json.new arvel.json
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Pack the plugin
        run: |
          tar -czf arvel-plugin-team-sample.tar.gz arvel.json roles
          sha256sum arvel.json arvel-plugin-team-sample.tar.gz > checksums.txt
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" \
            --notes-file notes.md arvel.json arvel-plugin-team-sample.tar.gz checksums.txt
