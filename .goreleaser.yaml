# SPDX-License-Identifier: Apache-2.0
version: 2
project_name: arvel-plugin-check
builds:
  - id: checker
    main: ./cmd/arvel-plugin-check
    binary: arvel-plugin-check
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags: ['-s -w']
archives:
  - id: checker
    ids: [checker]
    name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, NOTICE, README.md, CHANGELOG.md]
checksum:
  name_template: checksums.txt
release:
  draft: true
  prerelease: auto
changelog:
  disable: true
