name: basic-turn
plugin:
  env:
    ARVEL_CLAUDE_BIN: "{{fakevendor:claude-basic-turn}}"
initialize:
  connection: { kind: subscription, config: {} }
steps:
  - call: _arvel/status
    expect: { state: ready }
  - call: session/new
    params: { cwd: "{{tmpdir}}", _meta: { arvel: { model: sonnet } } }
    save: { session: $.sessionId }
  - call: session/prompt
    params: { sessionId: "{{session}}", prompt: [{ type: text, text: "hi" }] }
    expectUpdates:
      - sessionUpdate: agent_message_chunk
    answerPermissions: allow_once
    expect: { stopReason: end_turn }
